# Open ADMS local stack: who may log in to Postgres, and how (ARCHITECTURE §5.7; KD-78; ADR-517).
# Over TCP, TLS alone: every line is `hostssl`, so a connection that won't speak TLS matches none
# and is refused, from the stack's network and from this machine's loopback alike. Each login
# proves its password with SCRAM; every service's login asks `sslmode=verify-full`, checking the
# server's certificate against the stack's own root.
# The local socket is inside the container alone (its own tmpfs): the image's entrypoint uses it
# to set a new database up, and it trusts as the image's own default does.

# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            trust
hostssl  all       all   all      scram-sha-256
