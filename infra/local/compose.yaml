# Open ADMS local stack (ARCHITECTURE §4; BACKLOG 0.2.3; ADR-263, 264).
# Run it through the helper, never by hand: `pnpm local:up`, `pnpm local:down`, `pnpm local:wipe`,
# `pnpm local:status` (infra/local/src/index.ts). The helper generates `.env` beside this file
# (git-ignored, mode 0600) with the dev passwords; nothing secret is written here.
#
# HTTPS only: Caddy is the one way in from the host (loopback only), on *.adms.localhost. Plain
# HTTP on port 80 is redirected to HTTPS. Postgres and the mail catcher's SMTP port are published
# on 127.0.0.1 for local tools; nothing is published on other interfaces. Every image is pinned by
# tag and digest (ADR-264, 282).
#
# Every hop is encrypted, locally too (ARCHITECTURE §4; KD-78; ADR-513, 517): Caddy reaches each
# service over TLS, Postgres takes TLS alone, and the mail catcher takes mail only after STARTTLS.
# Each service holds a certificate of the stack's own root, which `pnpm local:up` makes into
# .generated/ (infra/local/src/certificates.ts) and mounts read-only at /run/adms/tls; Caddy
# issues the public names' certificates from the same root. Only a container's own loopback (a
# health check inside it, Valhalla and the object store each behind its own Caddy) is plain, and
# never leaves it.
#
# Every container is hardened as far as its image allows (OWASP ASVS 5.0 4.2.1; KD-79; ADR-517):
# no capability, a read-only root filesystem, an unprivileged user, no new privileges. Where an
# image needs more, its service says what and why; infra/local/test/compose.test.ts holds every
# service to it.
#
# The routing server (Valhalla) and the address server (Nominatim) read one OpenStreetMap extract,
# downloaded and checked against its pinned SHA-256 by `pnpm local:up` into infra/local/.cache/maps/
# (git-ignored) and mounted read-only (REQ-022, ADR-282). Each builds its own data from it on a
# first run, and again when the extract changes. Neither publishes a port: both are reached through
# Caddy, over HTTPS. The API is the seventh service and the worker the eighth, each in its own
# profile (below).
name: open-adms-local

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    # The image's own `postgres` user, which owns the data volume: the entrypoint, run as it, has
    # nothing to change owner of and no user to switch to.
    user: '999:999'
    # Its socket's folder and the temporary files, each its user's own and lost with the container.
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775
      - /tmp:uid=999,gid=999,mode=0700
    # TLS alone (ARCHITECTURE §5.7; KD-78): every login over TCP is `hostssl` (postgres/pg_hba.conf),
    # so a client that won't speak TLS is refused, and every service's login asks `verify-full`.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/adms/tls/postgres.crt
      - -c
      - ssl_key_file=/run/adms/tls/postgres.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/adms/pg_hba.conf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # The database administrator's password, which the image reads once, to set a new database
      # up: written by `pnpm local:up` from infra/local/.env into a file readable by its owner
      # alone, and mounted read-only (a read-only container takes no secret compose would copy).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - '127.0.0.1:${ADMS_PG_PORT:-55432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
      - ./.generated/postgres/password:/run/secrets/postgres_password:ro
      - ./postgres/pg_hba.conf:/etc/adms/pg_hba.conf:ro
      - ./.generated/tls/postgres.crt:/run/adms/tls/postgres.crt:ro
      - ./.generated/tls/postgres.key:/run/adms/tls/postgres.key:ro
    healthcheck:
      # Over TCP, so the entrypoint's temporary socket-only server during first init doesn't count.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  objectstore:
    <<: *hardening
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    # The image's own `seaweed` user, which owns the data volume: the entrypoint, run as it, has
    # no owner to change and no user to switch to.
    user: '1000:1000'
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    # One process: master, volume, filer and the S3 gateway, every one of them, and each one's
    # gRPC, listening on the container's own loopback alone (OWASP ASVS 5.0 4.2.1, 12.3.3;
    # ADR-525): none speaks TLS or asks who is calling, and no hop of ours but S3 uses them. S3
    # is reached only through `objectstore-tls` below, which shares this container's network and
    # takes TLS for it, and that only through Caddy (https://s3.adms.localhost); no port is
    # published to the host. `server`, not `mini`: `mini` keeps its admin server's gRPC on every
    # interface whatever it is told, and only `server` binds S3 apart from the rest.
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.telemetry=false
      # What `mini` chose for this disk: small volumes, as many as the free space holds.
      - -master.volumeSizeLimitMB=128
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=8334
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.allowDeleteBucketNotEmpty=false
      # CORS by exact allow-list, never '*' (ARCHITECTURE §6). Widened when the web apps arrive.
      - -s3.allowedOrigins=https://adms.localhost
      - -filer.allowedOrigins=https://adms.localhost
    volumes:
      - objectstore_data:/data
      # Who the store knows: written by `pnpm local:up` from infra/local/.env, readable by its
      # owner alone (infra/local/src/index.ts, StoreIdentities).
      - ./.generated/objectstore/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Inside the container, on its loopback, which never leaves it.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8334/healthz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  objectstore-tls:
    <<: *hardening
    # TLS for the object store (KD-78; ADR-517, 525), as `routing-tls` is for Valhalla: this Caddy
    # shares the store's container's network, takes TLS on 8333 with the stack's certificate for
    # `objectstore`, and hands each request to S3 over that container's loopback
    # (objectstore/Caddyfile), keeping the Host header, so S3 signatures verify. Nothing else of
    # the store is reachable from the stack's network.
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    network_mode: service:objectstore
    user: '1000:1000'
    # The image's caddy binary carries the file capability to bind a low port, and the kernel
    # refuses to start a binary whose file capability isn't in the container's bounding set. It is
    # kept there and never held: an unprivileged user under no-new-privileges gains none of it.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    environment:
      # The root its health check (OpenSSL's) checks the certificate against: the stack's own.
      SSL_CERT_FILE: /run/adms/tls/root.crt
    volumes:
      - ./objectstore/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.generated/caddy-root.crt:/run/adms/tls/root.crt:ro
      - ./.generated/tls/objectstore.crt:/run/adms/tls/objectstore.crt:ro
      - ./.generated/tls/objectstore.key:/run/adms/tls/objectstore.key:ro
    depends_on:
      # Its network is the store's container's: made again when that one is.
      objectstore:
        condition: service_healthy
        restart: true
    healthcheck:
      # Through its own TLS to S3's health answer, inside the shared network, its certificate
      # checked against the stack's root and the name `objectstore`.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'https://objectstore:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mail:
    <<: *hardening
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    user: '65534:65534'
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_MAX_MESSAGES: '5000'
      # Mail is taken only after STARTTLS, with the stack's certificate for `mail` (KD-78), and
      # the inbox is served over HTTPS to Caddy.
      MP_SMTP_TLS_CERT: /run/adms/tls/mail.crt
      MP_SMTP_TLS_KEY: /run/adms/tls/mail.key
      MP_SMTP_REQUIRE_STARTTLS: 'true'
      MP_UI_TLS_CERT: /run/adms/tls/mail.crt
      MP_UI_TLS_KEY: /run/adms/tls/mail.key
    ports:
      - '127.0.0.1:${ADMS_SMTP_PORT:-1025}:1025'
    volumes:
      - ./.generated/tls/mail.crt:/run/adms/tls/mail.crt:ro
      - ./.generated/tls/mail.key:/run/adms/tls/mail.key:ro
    healthcheck:
      # Inside the container, on its loopback: whether it answers, its certificate unread.
      test: ['CMD', '/mailpit', 'readyz', '--https']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  routing:
    <<: *hardening
    image: ghcr.io/valhalla/valhalla:3.9.0@sha256:511c095b8caf393dccceb8b519ec96b6f85a0166b2288ba014a8a748acc5a63c
    # The image runs as root, which owns the data volume (the image has no other user); it gets no
    # capability and a read-only root filesystem. Valhalla's workers talk over sockets in /tmp.
    # It listens on its own loopback alone; `routing-tls` below takes TLS for it.
    user: '0:0'
    tmpfs:
      - /tmp
    command: ['bash', '/opt/open-adms/start.sh']
    environment:
      ADMS_MAP_NAME: ${ADMS_MAP_NAME:?run pnpm local:up}
      ADMS_MAP_SHA256: ${ADMS_MAP_SHA256:?run pnpm local:up}
    volumes:
      - ./routing/start.sh:/opt/open-adms/start.sh:ro
      - ${ADMS_MAP_FILE:?run pnpm local:up}:/maps/region.osm.pbf:ro
      - routing_data:/data
    healthcheck:
      # Inside the container, on its loopback, which never leaves it.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8002/status']
      interval: 5s
      timeout: 5s
      retries: 20
      # Building the road tiles (a first run, or a new extract) comes before the first answer.
      start_period: 600s

  routing-tls:
    <<: *hardening
    # TLS for the routing server (KD-78; ADR-517): Valhalla speaks none, so this Caddy shares its
    # container's network, takes TLS on 8443 with the stack's certificate for `routing`, and hands
    # each request to Valhalla over that container's loopback (routing/Caddyfile).
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    network_mode: service:routing
    user: '1000:1000'
    # The image's caddy binary carries the file capability to bind a low port, and the kernel
    # refuses to start a binary whose file capability isn't in the container's bounding set. It is
    # kept there and never held: an unprivileged user under no-new-privileges gains none of it.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    environment:
      # The root its health check (OpenSSL's) checks the certificate against: the stack's own.
      SSL_CERT_FILE: /run/adms/tls/root.crt
    volumes:
      - ./routing/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.generated/caddy-root.crt:/run/adms/tls/root.crt:ro
      - ./.generated/tls/routing.crt:/run/adms/tls/routing.crt:ro
      - ./.generated/tls/routing.key:/run/adms/tls/routing.key:ro
    depends_on:
      # Its network is the routing server's container's: made again when that one is.
      routing:
        condition: service_started
        restart: true
    healthcheck:
      # Through its own TLS to Valhalla's status, inside the shared network, its certificate
      # checked against the stack's root and the name `routing`.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'https://routing:8443/status']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  addresses:
    restart: unless-stopped
    # Hardened as far as the image allows (KD-79; ADR-517). Its own start script runs as root and
    # changes user with sudo, for the Postgres it keeps inside this container (Nominatim's own
    # database, apart from the evidence database) and for Nominatim itself: so no
    # `no-new-privileges` (sudo is setuid) and these capabilities alone of Docker's default set:
    # CHOWN, DAC_OVERRIDE, FOWNER (its Postgres's files), SETUID, SETGID (sudo), KILL (stopping its
    # own processes). Its root filesystem stays writable: the script writes its Postgres's
    # settings, its logs and Nominatim's website files under / on every start.
    # addresses/start.sh closes that Postgres to everything outside the container.
    image: mediagis/nominatim:5.3.2-2026-06-23T09-03@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    command: ['bash', '/opt/open-adms/start.sh']
    environment:
      ADMS_MAP_NAME: ${ADMS_MAP_NAME:?run pnpm local:up}
      ADMS_MAP_SHA256: ${ADMS_MAP_SHA256:?run pnpm local:up}
      PBF_PATH: /maps/region.osm.pbf
      # A dated extract is never updated in place: a newer one is imported afresh.
      FREEZE: 'true'
      # Address lookup only (ARCHITECTURE §3: GPS to street number and name): no search index and
      # no points of interest, so the import is small and quick (ADR-282).
      REVERSE_ONLY: 'true'
      IMPORT_STYLE: address
      THREADS: '4'
      GUNICORN_WORKERS: '2'
      # The image's Postgres is tuned for a 32 GB server; these fit a laptop's container.
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAINTENANCE_WORK_MEM: 512MB
      POSTGRES_AUTOVACUUM_WORK_MEM: 128MB
      POSTGRES_WORK_MEM: 32MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_MAX_WAL_SIZE: 128MB
      # Nominatim's server (gunicorn) takes TLS alone, with the stack's certificate for
      # `addresses` (KD-78): the image's start script hands its environment through to it. No
      # control socket: gunicorn 26 makes one under its user's home, which the `nominatim` user
      # it runs as can't write, and nothing here uses it (ADR-552 (4), 554).
      GUNICORN_CMD_ARGS: --certfile=/run/adms/tls/addresses.crt --keyfile=/run/adms/tls/addresses.key --no-control-socket
    shm_size: 512mb
    volumes:
      - ./addresses/start.sh:/opt/open-adms/start.sh:ro
      - ${ADMS_MAP_FILE:?run pnpm local:up}:/maps/region.osm.pbf:ro
      - addresses_data:/var/lib/postgresql/16/main
      - ./.generated/caddy-root.crt:/run/adms/tls/root.crt:ro
      - ./.generated/tls/addresses.crt:/run/adms/tls/addresses.crt:ro
      - ./.generated/tls/addresses.key:/run/adms/tls/addresses.key:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - --cacert
        - /run/adms/tls/root.crt
        - --resolve
        - addresses:8080:127.0.0.1
        - https://addresses:8080/status
      interval: 10s
      timeout: 5s
      retries: 12
      # The import (a first run, or a new extract) comes before the first answer.
      start_period: 1800s

  api:
    <<: *hardening
    # The API (ARCHITECTURE §4, §6; ADR-384, 385). Node alone, pinned like every image: the built
    # code and its dependencies are mounted read-only from this checkout, each folder by name, so no
    # env file but its own reaches the container. Started by `pnpm local:up` once `pnpm installer`
    # has written apps/api/.env (the profile), after building apps/api. No port is published: Caddy
    # is the only way in, over HTTPS.
    profiles: ['api']
    image: node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    user: '1000:1000'
    working_dir: /srv/open-adms
    command: ['node', 'apps/api/dist/main.js']
    environment:
      NODE_ENV: production
      ADMS_ENV_FILE: /run/secrets/api_env
      ADMS_API_HOST: 0.0.0.0
      ADMS_API_PORT: '3000'
      # The API serves HTTPS alone, with the stack's certificate for `api` (KD-78; ADR-517).
      ADMS_API_TLS_CERT_FILE: /run/adms/tls/api.crt
      ADMS_API_TLS_KEY_FILE: /run/adms/tls/api.key
      # The installer wrote the logins as this machine reaches Postgres; in here it is a service,
      # and the root its certificate is checked against is mounted below.
      ADMS_DATABASE_ADDRESS: postgres:5432
      ADMS_DATABASE_CA_FILE: /run/adms/tls/root.crt
      # The same for the mail catcher, where the installation sends mail through it (ADR-405).
      ADMS_SMTP_ADDRESS: mail:1025
      ADMS_SMTP_CA_FILE: /run/adms/tls/root.crt
      # The exact origins whose pages may read an answer (ADR-098, 391; AC-11-02; ADR-565): the
      # field app's browser build, and its native builds' (Capacitor's on iOS, then on Android); and
      # the back office's, which sends the session's cookies and its CSRF value (ARCHITECTURE §6).
      ADMS_CORS_ORIGINS: https://field.adms.localhost,capacitor://localhost,https://localhost,https://office.adms.localhost
      # The one proxy whose word is taken for a caller's address (ADR-416): Caddy, at the address
      # the stack's network gives it below. Rate limits count by that address.
      ADMS_TRUSTED_PROXIES: 172.30.213.2
      # The address server is asked by its own name, over HTTPS, through Caddy, for a phone's
      # address lookup (ADR-455), as the worker asks it below: in here Caddy is at the address
      # the stack's network gives it, and its root certificate is mounted below.
      ADMS_MAP_SERVERS_ADDRESS: 172.30.213.2:443
      ADMS_MAP_CA_FILE: /run/adms/tls/root.crt
      # The object store the API keeps files in is asked the same way (ADR-480): by its own
      # name, over HTTPS, through Caddy, under the API's own identity there.
      ADMS_MEDIA_ADDRESS: 172.30.213.2:443
      ADMS_MEDIA_CA_FILE: /run/adms/tls/root.crt
    secrets:
      - api_env
    volumes:
      - ../../node_modules:/srv/open-adms/node_modules:ro
      # The release's number is the repository's root package.json's: the API reads it at start.
      - ../../package.json:/srv/open-adms/package.json:ro
      - ../../apps/api/package.json:/srv/open-adms/apps/api/package.json:ro
      - ../../apps/api/node_modules:/srv/open-adms/apps/api/node_modules:ro
      - ../../apps/api/dist:/srv/open-adms/apps/api/dist:ro
      - ../../packages/contracts/package.json:/srv/open-adms/packages/contracts/package.json:ro
      - ../../packages/contracts/node_modules:/srv/open-adms/packages/contracts/node_modules:ro
      - ../../packages/contracts/dist:/srv/open-adms/packages/contracts/dist:ro
      - ../../packages/db/package.json:/srv/open-adms/packages/db/package.json:ro
      - ../../packages/db/node_modules:/srv/open-adms/packages/db/node_modules:ro
      - ../../packages/db/dist:/srv/open-adms/packages/db/dist:ro
      - ../../packages/domain/package.json:/srv/open-adms/packages/domain/package.json:ro
      - ../../packages/domain/node_modules:/srv/open-adms/packages/domain/node_modules:ro
      - ../../packages/domain/dist:/srv/open-adms/packages/domain/dist:ro
      - ../../packages/domain/policy.env:/srv/open-adms/packages/domain/policy.env:ro
      - ../../packages/domain/breached-passwords.txt:/srv/open-adms/packages/domain/breached-passwords.txt:ro
      - ../../packages/receipts/package.json:/srv/open-adms/packages/receipts/package.json:ro
      - ../../packages/receipts/node_modules:/srv/open-adms/packages/receipts/node_modules:ro
      - ../../packages/receipts/dist:/srv/open-adms/packages/receipts/dist:ro
      - ./.generated/caddy-root.crt:/run/adms/tls/root.crt:ro
      - ./.generated/tls/api.crt:/run/adms/tls/api.crt:ro
      - ./.generated/tls/api.key:/run/adms/tls/api.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # Over its own TLS, inside the container, its certificate checked as Caddy checks it.
        - "require('node:https').get({ host: '127.0.0.1', port: 3000, path: '/health', servername: 'api', ca: require('node:fs').readFileSync('/run/adms/tls/root.crt') }, (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *hardening
    # The worker (ARCHITECTURE §4, §13; ADR-419), as the API above: Node alone, the built code and
    # its dependencies mounted read-only, no env file but its own. Started by `pnpm local:up` once
    # `pnpm installer` has written apps/worker/.env (the profile), after building apps/worker. It
    # publishes no port and no proxy leads to it: its health answer listens on its own loopback,
    # for the check below and for `pnpm installer:check`.
    profiles: ['worker']
    image: node:24.21.0-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    user: '1000:1000'
    working_dir: /srv/open-adms
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      ADMS_ENV_FILE: /run/secrets/worker_env
      ADMS_WORKER_HOST: 127.0.0.1
      ADMS_WORKER_PORT: '3001'
      # The installer wrote the login as this machine reaches Postgres; in here it is a service,
      # and the root its certificate is checked against is mounted below.
      ADMS_DATABASE_ADDRESS: postgres:5432
      ADMS_DATABASE_CA_FILE: /run/adms/tls/root.crt
      # The map servers are asked by their own names, over HTTPS, through Caddy: in here Caddy is
      # at the address the stack's network gives it, and the stack's root is mounted below.
      ADMS_MAP_SERVERS_ADDRESS: 172.30.213.2:443
      ADMS_MAP_CA_FILE: /run/adms/tls/root.crt
      # The extract both map servers were built from: the stack's own word (`pnpm local:up`).
      ADMS_MAP_EXTRACT_SHA256: ${ADMS_MAP_SHA256:?run pnpm local:up}
    secrets:
      - worker_env
    volumes:
      - ../../node_modules:/srv/open-adms/node_modules:ro
      - ../../apps/worker/package.json:/srv/open-adms/apps/worker/package.json:ro
      - ../../apps/worker/node_modules:/srv/open-adms/apps/worker/node_modules:ro
      - ../../apps/worker/dist:/srv/open-adms/apps/worker/dist:ro
      - ../../packages/db/package.json:/srv/open-adms/packages/db/package.json:ro
      - ../../packages/db/node_modules:/srv/open-adms/packages/db/node_modules:ro
      - ../../packages/db/dist:/srv/open-adms/packages/db/dist:ro
      - ../../packages/domain/package.json:/srv/open-adms/packages/domain/package.json:ro
      - ../../packages/domain/node_modules:/srv/open-adms/packages/domain/node_modules:ro
      - ../../packages/domain/dist:/srv/open-adms/packages/domain/dist:ro
      - ../../packages/domain/policy.env:/srv/open-adms/packages/domain/policy.env:ro
      - ./.generated/caddy-root.crt:/run/adms/tls/root.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # On its own loopback, inside the container: no proxy leads to it, and it never leaves.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    <<: *hardening
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    user: '1000:1000'
    # The image's caddy binary carries the file capability to bind a low port, and the kernel
    # refuses to start a binary whose file capability isn't in the container's bounding set. It is
    # kept there and never held: an unprivileged user under no-new-privileges gains none of it,
    # and binds 80 and 443 as Docker lets any user in a container's own network.
    cap_add:
      - NET_BIND_SERVICE
    # What Caddy keeps (the certificates it issues, its locks) lasts as long as the container:
    # it issues them afresh from the stack's root on every start.
    tmpfs:
      - /data:uid=1000,gid=1000,mode=0700
      - /config:uid=1000,gid=1000,mode=0700
    # A fixed address, so that the API can name the proxy it believes (ADMS_TRUSTED_PROXIES).
    networks:
      default:
        ipv4_address: 172.30.213.2
    # The stories' API listens on this machine (ADR-491): Docker Desktop names it already, and a
    # Linux host is told here.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${ADMS_HTTPS_PORT:-443}:443'
      - '127.0.0.1:${ADMS_HTTP_PORT:-80}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The stack's root and its key, which Caddy issues the public names' certificates from and
      # checks every service's certificate against (certificates.ts).
      - ./.generated/caddy-root.crt:/run/adms/tls/root.crt:ro
      - ./.generated/tls/root.key:/run/adms/tls/root.key:ro
      # The field app's browser build, as `vite build` wrote it (ADR-565): `pnpm local:up` builds
      # it first, so the folder is there before Caddy starts; a later build is served at once.
      - ../../apps/field/dist/web:/srv/field:ro
      # The back office and its viewer portal, built the same way (ARCHITECTURE §14).
      - ../../apps/back-office/dist/web:/srv/office:ro
      # The same, built for its browser tests' own world (the stories' API as its one server).
      - ../../apps/back-office/dist/world:/srv/office-world:ro
    depends_on:
      objectstore-tls:
        condition: service_healthy
      mail:
        condition: service_healthy
    healthcheck:
      # Its admin endpoint, on its own loopback inside the container.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

# The stack's own network, its addresses fixed so that Caddy's can be named (ADR-416): Caddy
# takes .2, and every other service is handed one from the upper half, never Caddy's.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.213.0/24
          ip_range: 172.30.213.128/25

secrets:
  # The API's own settings, the installer's file, read by the process itself (never an env_file:
  # that would put each value in the container's description).
  api_env:
    file: ../../apps/api/.env
  # The worker's, the same way.
  worker_env:
    file: ../../apps/worker/.env

volumes:
  postgres_data:
  objectstore_data:
  routing_data:
  addresses_data:
