name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PGPASSWORD: adms
  DATABASE_URL: postgresql://adms:adms@127.0.0.1:5432/openadms
  JWT_SECRET: ci-secret-not-for-production

jobs:
  # ---------------------------------------------------------------------------
  # The schema and the API, against Postgres with PostGIS and without it.
  # PostGIS being optional is a claim this repository makes, so it is tested
  # rather than asserted.
  # ---------------------------------------------------------------------------
  database:
    name: schema + API (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres:16
            label: plain Postgres 16
          - image: postgis/postgis:16-3.4
            label: Postgres 16 + PostGIS

    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: adms
          POSTGRES_PASSWORD: adms
          POSTGRES_DB: openadms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adms -d openadms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U adms -d openadms && exit 0
            sleep 2
          done
          echo "Postgres never came up"; exit 1

      - name: Apply the schema, seed the demo project, run 106 assertions
        run: ./database/setup.sh --with-demo --test

      - name: Verify no applied migration has drifted
        run: ./database/migrate.sh --verify

      - name: Report migration state
        run: ./database/migrate.sh --status

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the API and its test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run 96 API tests
        working-directory: backend
        run: python3 -m pytest -q

  # ---------------------------------------------------------------------------
  # Both frontends have to compile, on the Node version the engines field asks
  # for and on the current LTS.
  # ---------------------------------------------------------------------------
  frontends:
    name: build ${{ matrix.app }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, mobile]
        node: ["18", "20"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.app }}
        env:
          VITE_API_URL: http://127.0.0.1:8080/api/v1
        run: npm run build

  # ---------------------------------------------------------------------------
  # A build passing proves the code parses. This proves the back office runs.
  # ---------------------------------------------------------------------------
  ui-walk:
    name: UI walk
    runs-on: ubuntu-latest
    needs: [database, frontends]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: adms
          POSTGRES_PASSWORD: adms
          POSTGRES_DB: openadms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adms -d openadms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Seed the database
        run: ./database/setup.sh --with-demo

      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8080 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          echo "API never became healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Build and serve the back office
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8080/api/v1
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 2
          done
          echo "Preview never came up"; cat "$RUNNER_TEMP/preview.log"; exit 1

      - name: Walk it
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node e2e/uiwalk.mjs --shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-walk-screenshots
          path: e2e/shots
          if-no-files-found: ignore
          retention-days: 7

      - name: API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true
