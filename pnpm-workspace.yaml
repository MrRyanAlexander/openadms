# Open ADMS workspace (ARCHITECTURE §18; ADR-255). Settings live here, not in .npmrc (pnpm 11+).
packages:
  - apps/*
  - packages/*
  - infra/local
  - tools/*

# Supply chain (ARCHITECTURE §16; ADR-255).
# Refuse any version published less than 7 days ago (minutes).
minimumReleaseAge: 10080
# No dependency runs an install script unless it is allowed here, by name, in an ADR.
strictDepBuilds: true
allowBuilds:
  # Prisma's Node check and its schema-engine download; the CLI fetches the engine itself,
  # checked against its SHA-256, on first use (ADR-267).
  prisma: false
  '@prisma/engines': false
# Refuse git and tarball dependencies pulled in by other packages.
blockExoticSubdeps: true
# Refuse a package whose engines don't match (Node 24).
engineStrict: true
# Exact versions only: every dependency is pinned (AGENTS.md).
savePrefix: ''

# The dependency audit (`pnpm security`; ADR-276): every advisory, at any severity, fails the run,
# unless it is accepted here by its GitHub advisory id, each one named in an ADR with why it can't be
# reached. Looked at again at every upgrade of the package that brings it in.
auditConfig:
  ignoreGhsas:
    # deepmerge-ts 7.1.5 in @prisma/config (Prisma CLI 7.10.0): it merges only our own prisma.config.js.
    - GHSA-ggr8-5vv4-36mx
    # mysql2 3.15.3, the Prisma CLI's MySQL driver: Open ADMS never opens a MySQL connection.
    - GHSA-3f6p-5ww8-9rcr
    - GHSA-rgwj-5xj2-c3m3
